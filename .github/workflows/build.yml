
name: Build Python to EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --console --name Program-Predikat-Nilai main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Program-Predikat-Nilai-EXE
          path: dist/Program-Predikat-Nilai.exe
